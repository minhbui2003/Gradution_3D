name: Validate graduation PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/scroll-750-frames]

permissions:
  contents: read

jobs:
  build-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check frame sequence files and manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/sequences')
          data = json.loads(Path('public/sequences-manifest.json').read_text(encoding='utf-8'))
          assert data['frameCountTotal'] == 750
          assert data['sceneCount'] == 5
          for idx in range(1, 6):
              folder = root / f'scene-{idx:02d}'
              frames = sorted(folder.glob('frame-*.webp'))
              assert len(frames) == 150, (folder, len(frames))
              assert [f.name for f in frames] == [f'frame-{i:03d}.webp' for i in range(150)]
              assert all(f.stat().st_size > 0 for f in frames)
          print('Verified 750 WebP frames across 5 scenes')
          PY
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
